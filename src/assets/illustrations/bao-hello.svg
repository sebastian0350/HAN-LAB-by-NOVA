<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Тело панды (приветствие - машет лапой) -->
  <ellipse cx="120" cy="160" rx="50" ry="60" fill="#1E1E1C"/>
  <!-- Голова -->
  <circle cx="120" cy="90" r="45" fill="#1E1E1C"/>
  <!-- Уши -->
  <circle cx="85" cy="55" r="18" fill="#1E1E1C"/>
  <circle cx="155" cy="55" r="18" fill="#1E1E1C"/>
  <!-- Глаза (белые пятна) -->
  <ellipse cx="100" cy="85" rx="15" ry="12" fill="#EDE8DC"/>
  <ellipse cx="140" cy="85" rx="15" ry="12" fill="#EDE8DC"/>
  <!-- Зрачки -->
  <circle cx="100" cy="85" r="6" fill="#1E1E1C"/>
  <circle cx="140" cy="85" r="6" fill="#1E1E1C"/>
  <!-- Нос -->
  <ellipse cx="120" cy="100" rx="8" ry="5" fill="#1E1E1C"/>
  <!-- Рот (улыбка) -->
  <path d="M 110 110 Q 120 118 130 110" stroke="#EDE8DC" stroke-width="2" fill="none"/>
  <!-- Правая лапа (поднята - машет) -->
  <ellipse cx="170" cy="100" rx="20" ry="25" fill="#1E1E1C" transform="rotate(-20 170 100)"/>
</svg>
