  <!-- Голова -->
  <circle cx="120" cy="90" r="45" fill="#1E1E1C"/>
  <!-- Уши -->
  <circle cx="85" cy="55" r="18" fill="#1E1E1C"/>
  <circle cx="155" cy="55" r="18" fill="#1E1E1C"/>
  <!-- Глаза (закрыты - дуги) -->
  <path d="M 90 85 Q 100 80 110 85" stroke="#EDE8DC" stroke-width="3" fill="none"/>
  <path d="M 130 85 Q 140 80 150 85" stroke="#EDE8DC" stroke-width="3" fill="none"/>
  <!-- Нос -->
  <ellipse cx="120" cy="100" rx="8" ry="5" fill="#1E1E1C"/>
  <!-- Рот (широкая улыбка) -->
  <path d="M 108 110 Q 120 122 132 110" stroke="#EDE8DC" stroke-width="2" fill="none"/>
</svg>
